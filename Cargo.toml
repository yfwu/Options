[workspace]
resolver = "2"
members = ["crates/core", "crates/data", "crates/cli", "crates/app"]
default-members = ["crates/core", "crates/data", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["yfwu"]

[workspace.dependencies]
optlab-core = { path = "crates/core" }
optlab-data = { path = "crates/data" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
csv = "1"
dirs = "5"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies", "gzip"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 2
