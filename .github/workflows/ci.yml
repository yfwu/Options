name: CI

# Runs only when code, data or the workflow itself changes (docs, screenshots and the
# validation reports do not trigger builds). A newer push to the same branch cancels
# the run still in progress, so a burst of commits produces one result, not many.
on:
  push:
    paths:
      - "crates/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test core / data / cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit & integration tests
        run: cargo test --locked -p optlab-core -p optlab-data -p optlab-cli
      - name: LEAPS backtest smoke run (bundled data)
        run: cargo run --locked --release -p optlab-cli -- backtest --symbol QQQ

  app:
    name: Build desktop app (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libssl-dev pkg-config libzstd-dev
      - name: Build optlab-app and optlab CLI
        run: cargo build --locked --release -p optlab-app -p optlab-cli
      - uses: actions/upload-artifact@v6
        with:
          name: optlab-${{ matrix.os }}
          path: |
            target/release/optlab-app
            target/release/optlab-app.exe
            target/release/optlab
            target/release/optlab.exe
          if-no-files-found: ignore
