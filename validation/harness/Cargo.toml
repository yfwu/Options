[package]
name = "optlab-validation-harness"
version = "0.1.0"
edition = "2021"
publish = false

# Stand-alone: NOT a member of the OptLab workspace.
[workspace]

[dependencies]
optlab-core = { path = "../../crates/core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rayon = "1"

[profile.release]
opt-level = 3
